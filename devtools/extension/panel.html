<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stellar Hooks DevTools Panel</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        background-color: #0f172a;
        color: #f8fafc;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background-color: #1e293b;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        gap: 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #22c55e;
        box-shadow: 0 0 8px #22c55e;
      }
      .badge {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background-color: rgba(51, 65, 85, 0.6);
        color: #94a3b8;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input[type="search"] {
        padding: 5px 8px;
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background-color: #0f172a;
        color: #f8fafc;
        outline: none;
        width: 160px;
      }
      button.btn {
        padding: 5px 10px;
        font-size: 11px;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background-color: rgba(51, 65, 85, 0.6);
        color: #94a3b8;
        cursor: pointer;
      }
      button.btn:hover {
        background-color: rgba(51, 65, 85, 0.9);
        color: #f8fafc;
      }
      .filters-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        background-color: #0f172a;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        font-size: 11px;
      }
      .filter-btn {
        background: transparent;
        border: 1px solid transparent;
        color: #94a3b8;
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
        text-transform: capitalize;
      }
      .filter-btn.active {
        background-color: #1e293b;
        color: #38bdf8;
        border-color: rgba(148, 163, 184, 0.3);
        font-weight: 600;
      }
      .main-split {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .instances-list {
        width: 42%;
        min-width: 220px;
        border-right: 1px solid rgba(148, 163, 184, 0.2);
        overflow-y: auto;
        background-color: #0f172a;
      }
      .instance-item {
        padding: 10px 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        cursor: pointer;
        transition: background-color 0.12s ease;
      }
      .instance-item:hover {
        background-color: rgba(30, 41, 59, 0.5);
      }
      .instance-item.selected {
        background-color: #1e293b;
      }
      .instance-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .instance-name {
        font-weight: 600;
        font-size: 13px;
      }
      .status-pill {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 9999px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      .status-loading {
        background: rgba(14, 165, 233, 0.2);
        color: #38bdf8;
        border: 1px solid rgba(14, 165, 233, 0.4);
      }
      .status-success {
        background: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.4);
      }
      .status-error {
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.4);
      }
      .status-idle {
        background: rgba(100, 116, 139, 0.2);
        color: #94a3b8;
        border: 1px solid rgba(100, 116, 139, 0.4);
      }
      .instance-sub-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: #94a3b8;
      }
      .error-preview {
        color: #f87171;
        font-size: 11px;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .inspector-pane {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background-color: #1e293b;
      }
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #94a3b8;
        text-align: center;
        padding: 24px;
      }
      .error-box {
        padding: 12px;
        border-radius: 6px;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        margin-bottom: 16px;
        font-size: 12px;
      }
      pre.state-box {
        margin: 0;
        background: #0f172a;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 6px;
        padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="indicator"></span>
        <span>Stellar Hooks DevTools</span>
        <span class="badge" id="active-count">0 active</span>
      </div>
      <div class="controls">
        <input type="search" id="search-input" placeholder="Filter hooks..." />
        <button class="btn" id="refresh-btn">Refresh</button>
        <button class="btn" id="clear-btn">Clear</button>
      </div>
    </header>

    <div class="filters-bar">
      <span style="color: #94a3b8">Filter:</span>
      <button class="filter-btn active" data-filter="all">All (<span id="count-all">0</span>)</button>
      <button class="filter-btn" data-filter="loading">Loading (<span id="count-loading">0</span>)</button>
      <button class="filter-btn" data-filter="success">Success (<span id="count-success">0</span>)</button>
      <button class="filter-btn" data-filter="error">Error (<span id="count-error">0</span>)</button>
      <button class="filter-btn" data-filter="idle">Idle (<span id="count-idle">0</span>)</button>
    </div>

    <div class="main-split">
      <div class="instances-list" id="instances-container">
        <div class="empty-state">No active hook instances detected.</div>
      </div>
      <div class="inspector-pane" id="inspector-container">
        <div class="empty-state">
          <p>Select a hook instance from the left list to inspect its state.</p>
        </div>
      </div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
